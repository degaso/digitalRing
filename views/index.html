<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="../node_modules/androidjs/lib/androidjs.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 16px;

        /* Keine Textauswahl */
        -webkit-user-select: none;
        user-select: none;

        /* Kein Tap-Highlight */
        -webkit-tap-highlight-color: transparent;

        /* iOS/Android WebView: kein Callout */
        -webkit-touch-callout: none;
      }

      h2 { margin-top: 0; }

      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        width: 100%;
        padding: 14px 16px;
        font-size: 18px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }

      .btn:active {
        transform: scale(0.99);
      }

      .logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        border: 1px solid #eee;
        flex: 0 0 44px;
      }

      .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      .name {
        font-weight: 700;
        font-size: 17px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .phone {
        font-size: 14px;
        opacity: 0.7;
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.75;
      }

      .error {
        color: #b00020;
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <h2>DigitalRing</h2>

    <div id="list" class="list"></div>
    <div id="status" class="status">Lade Kontakte…</div>

    <script>
      const DATA_URL =
        "https://raw.githubusercontent.com/degaso/digitalRing/refs/heads/main/public/data.json";

      const listEl = document.getElementById("list");
      const statusEl = document.getElementById("status");

      // ✅ Langdruck/Markieren/Kontextmenü unterbinden (best effort)
      document.addEventListener("contextmenu", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("selectstart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("dragstart", (e) => e.preventDefault(), { passive: false });

      // Auf Touch-Geräten: langes Halten löst oft contextmenu/selection aus
      document.addEventListener(
        "touchstart",
        (e) => {
          // prevent default kann Scrollen stören – daher nur dann blocken,
          // wenn es auf einem Button passiert
          if (e.target.closest && e.target.closest(".btn")) e.preventDefault();
        },
        { passive: false }
      );

      function callNumber(number) {
        try {
          app.call.makeCall(String(number));
        } catch (e) {
          console.log("makeCall failed, fallback to tel:", e);
          window.location.href = "tel:" + encodeURIComponent(String(number));
        }
      }

      function createButton(entry) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";

        // Click / Tap
        btn.addEventListener("click", () => callNumber(entry.phone));

        // No-focus outline from long press / keyboard
        btn.addEventListener("mousedown", (e) => e.preventDefault());

        // Inhalt (Bild optional)
        if (entry.picture) {
          const img = document.createElement("img");
          img.className = "logo";
          img.src = entry.picture;
          img.alt = entry.name || "logo";
          img.loading = "lazy";
          img.draggable = false;
          img.addEventListener("error", () => {
            // wenn Bild kaputt -> weg damit
            img.remove();
          });
          btn.appendChild(img);
        }

        const meta = document.createElement("div");
        meta.className = "meta";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = entry.name || "Unbenannt";

        const phone = document.createElement("div");
        phone.className = "phone";
        phone.textContent = entry.phone || "";

        meta.appendChild(name);
        meta.appendChild(phone);
        btn.appendChild(meta);

        return btn;
      }

      async function loadData() {
        try {
          const res = await fetch(DATA_URL, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);

          const data = await res.json();
          if (!Array.isArray(data)) throw new Error("JSON ist kein Array");

          listEl.innerHTML = "";
          let count = 0;

          for (const entry of data) {
            if (!entry || !entry.phone) continue; // ohne Nummer keinen Button
            listEl.appendChild(createButton(entry));
            count++;
          }

          statusEl.textContent = count ? "" : "Keine Kontakte gefunden.";
        } catch (err) {
          console.log("loadData failed:", err);
          statusEl.textContent =
            "Konnte Kontakte nicht laden. Check URL / Internet / JSON.";
          statusEl.classList.add("error");
        }
      }

      loadData();
    </script>
  </body>
</html>
