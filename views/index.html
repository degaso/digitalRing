<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="../node_modules/androidjs/lib/androidjs.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: "Outfit", sans-serif;
        margin: 0;
        padding: 16px;
        background: #1b1e21;
        color: #fff;

        /* Keine Textauswahl */
        -webkit-user-select: none;
        user-select: none;

        /* Kein Tap-Highlight */
        -webkit-tap-highlight-color: transparent;

        /* iOS/Android WebView: kein Callout */
        -webkit-touch-callout: none;
      }

      .outfit-<uniquifier> {
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      h1 {
        margin-top: 6px;
        margin-bottom: 16px;
        font-weight: 600;
        text-transform: uppercase;
        text-align: center;
        line-height: 1;
      }

      h1 span {
        font-weight: 300;
      }

      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 16px 0 20px;
        font-size: 14px;
        opacity: 0.7;
      }

      .hint svg {
        width: 16px;
        height: 16px;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        width: 100%;
        padding: 14px 16px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        font-family: "Outfit", sans-serif;
        min-height: 72px;
        color: #1b1e21;
      }

      .btn:active {
        transform: scale(0.99);
      }

      .logo {
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        flex: 0 0 44px;
      }

      .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      .name {
        font-weight: 500;
        font-size: 22px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .phone {
        font-size: 14px;
        opacity: 0.7;
      }

      .arrow {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        color: #1b1e21;
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.75;
      }

      .error {
        color: #ca2b44;
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <h1><span>Gewerbepark</span><br />Austraße 101a</h1>

    <div class="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span>Antippen zum Klingeln</span>
    </div>

    <div id="list" class="list"></div>
    <div id="status" class="status">Lade Kontakte…</div>

    <script>
      const DATA_URL =
        "https://raw.githubusercontent.com/degaso/digitalRing/refs/heads/main/public/data.json";

      const listEl = document.getElementById("list");
      const statusEl = document.getElementById("status");

      // ✅ Langdruck/Markieren/Kontextmenü unterbinden (best effort)
      document.addEventListener("contextmenu", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("selectstart", (e) => e.preventDefault(), { passive: false });
      document.addEventListener("dragstart", (e) => e.preventDefault(), { passive: false });

      // Auf Touch-Geräten: langes Halten löst oft contextmenu/selection aus
      document.addEventListener(
        "touchstart",
        (e) => {
          // prevent default kann Scrollen stören – daher nur dann blocken,
          // wenn es auf einem Button passiert
          if (e.target.closest && e.target.closest(".btn")) e.preventDefault();
        },
        { passive: false }
      );

      function callNumber(number) {
        try {
          app.call.makeCall(String(number));
        } catch (e) {
          console.log("makeCall failed, fallback to tel:", e);
          window.location.href = "tel:" + encodeURIComponent(String(number));
        }
      }

      function createButton(entry) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.type = "button";

        // Click / Tap
        btn.addEventListener("click", () => callNumber(entry.phone));

        // No-focus outline from long press / keyboard
        btn.addEventListener("mousedown", (e) => e.preventDefault());

        // Inhalt (Bild optional)

        const meta = document.createElement("div");
        meta.className = "meta";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = entry.name || "Unbenannt";

        meta.appendChild(name);
        btn.appendChild(meta);

        if (entry.picture) {
          const img = document.createElement("img");
          img.className = "logo";
          img.src = entry.picture;
          img.alt = entry.name || "logo";
          img.loading = "lazy";
          img.draggable = false;
          img.addEventListener("error", () => {
            // wenn Bild kaputt -> weg damit
            img.remove();
          });
          btn.appendChild(img);
        }

        // Pfeil nach rechts
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        arrow.setAttribute("class", "arrow");
        arrow.setAttribute("viewBox", "0 0 24 24");
        arrow.setAttribute("fill", "none");
        arrow.setAttribute("stroke", "currentColor");
        arrow.setAttribute("stroke-width", "2");
        arrow.setAttribute("stroke-linecap", "round");
        arrow.setAttribute("stroke-linejoin", "round");
        arrow.innerHTML = '<polyline points="9 18 15 12 9 6"></polyline>';
        btn.appendChild(arrow);

        return btn;
      }

      async function loadData() {
        try {
          const res = await fetch(DATA_URL, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);

          const data = await res.json();
          if (!Array.isArray(data)) throw new Error("JSON ist kein Array");

          listEl.innerHTML = "";
          let count = 0;

          for (const entry of data) {
            if (!entry || !entry.phone) continue; // ohne Nummer keinen Button
            listEl.appendChild(createButton(entry));
            count++;
          }

          statusEl.textContent = count ? "" : "Keine Kontakte gefunden.";
        } catch (err) {
          console.log("loadData failed:", err);
          statusEl.textContent =
            "Konnte Kontakte nicht laden. Check URL / Internet / JSON.";
          statusEl.classList.add("error");
        }
      }

      loadData();
    </script>
  </body>
</html>
